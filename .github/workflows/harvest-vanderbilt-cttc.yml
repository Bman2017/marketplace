name: Harvest Vanderbilt CTTC

on:
  push:
    branches: [codex/harvest-vanderbilt-cttc-20260805]
    paths:
      - scripts/harvest_vanderbilt_cttc.py
      - .github/workflows/harvest-vanderbilt-cttc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Harvest all Vanderbilt CTTC records
        run: python scripts/harvest_vanderbilt_cttc.py
      - name: Upload harvest package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanderbilt-cttc-harvest-20260805
          path: vanderbilt-cttc-harvest/
          if-no-files-found: error
          retention-days: 30
