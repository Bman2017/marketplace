name: Fetch Florida ExpertNet Search JS

on:
  push:
    branches:
      - codex/harvest-florida-expertnet-20260805
    paths:
      - scripts/fetch_expertnet_search_js.py
      - .github/workflows/fetch-expertnet-search-js.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/fetch_expertnet_search_js.py
      - uses: actions/upload-artifact@v4
        with:
          name: florida-expertnet-search-js-20260805
          path: florida-expertnet-js
          if-no-files-found: error
