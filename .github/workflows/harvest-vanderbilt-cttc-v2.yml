name: Harvest Vanderbilt CTTC v2

on:
  push:
    branches: [codex/harvest-vanderbilt-cttc-20260805]
    paths:
      - scripts/harvest_vanderbilt_cttc_v2.py
      - .github/workflows/harvest-vanderbilt-cttc-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Harvest and validate Vanderbilt CTTC v2
        run: python scripts/harvest_vanderbilt_cttc_v2.py
      - name: Upload corrected harvest package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanderbilt-cttc-harvest-v2-20260805
          path: vanderbilt-cttc-harvest-v2/
          if-no-files-found: error
          retention-days: 30
