name: Probe Florida ExpertNet AJAX

on:
  push:
    branches:
      - codex/harvest-florida-expertnet-20260805
    paths:
      - scripts/probe_expertnet_ajax.py
      - .github/workflows/probe-expertnet-ajax.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe authoritative technology endpoint
        run: python scripts/probe_expertnet_ajax.py
      - uses: actions/upload-artifact@v4
        with:
          name: florida-expertnet-ajax-probe-20260805
          path: florida-expertnet-ajax-probe
          if-no-files-found: error
