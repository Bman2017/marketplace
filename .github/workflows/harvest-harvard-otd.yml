name: Harvest Harvard OTD

on:
  push:
    branches: [codex/harvard-harvest-transport-20260805]
    paths:
      - scripts/harvest_harvard_otd.py
      - .github/workflows/harvest-harvard-otd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Harvest all Harvard OTD records
        run: python scripts/harvest_harvard_otd.py
      - name: Upload harvest package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvard-otd-harvest-20260805
          path: harvard-otd-harvest/
          if-no-files-found: error
          retention-days: 30
