name: Purdue PRF Source-Complete Harvest

on:
  push:
    branches:
      - harvest/purdue-prf-source-complete-2026-08-04
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Apply execution-loop correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/purdue_prf_harvest.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for index, (official_url, item) in [
                  (idx, detail_results[idx]) for idx in sorted(detail_results)
              ]:
                  response = item[1] if False else None
                  # Unpack after the intentionally explicit ordering above.
                  official_url, api_item, detail_response = detail_results[index]
          '''
          new = '''    for index in sorted(detail_results):
                  official_url, api_item, detail_response = detail_results[index]
          '''
          if old not in text:
              raise SystemExit('Expected Purdue detail loop was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Harvest Purdue public licensing catalog
        id: harvest
        shell: bash
        run: |
          set +e
          python scripts/purdue_prf_harvest.py \
            --output-dir purdue-prf-harvest \
            --timeout 60 \
            --attempts 4 \
            --workers 6
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete harvest evidence
        uses: actions/upload-artifact@v4
        with:
          name: purdue-prf-source-complete-harvest-2026-08-04
          path: purdue-prf-harvest/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce source-completion gate
        shell: bash
        run: |
          test "${{ steps.harvest.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('purdue-prf-harvest/purdue_prf_source_manifest.json').read_text())
          assert manifest['source_complete'] is True, manifest
          assert manifest['official_live_total'] == 1675, manifest
          assert manifest['unique_listing_identities'] == manifest['official_live_total'], manifest
          assert manifest['unique_official_record_urls'] == manifest['official_live_total'], manifest
          assert manifest['detail_pages_with_receipts'] == manifest['official_live_total'], manifest
          assert manifest['api_pages_with_receipts'] == manifest['api_pages_expected'], manifest
          assert manifest['required_fields_missing'] == 0, manifest
          assert manifest['errors'] == 0, manifest
          print(json.dumps(manifest, indent=2))
          PY
