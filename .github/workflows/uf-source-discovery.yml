name: UF Technology Publisher Source-Complete Harvest

on:
  push:
    branches:
      - harvest/uf-source-complete-2026-08-05
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Configure low-rate browser session
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/uf_technology_publisher_harvest.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '''USER_AGENT = (
              "Arns-Innovations-UF-Public-Catalog-Harvest/1.0 "
              "(public metadata; source URLs and receipts retained)"
          )''',
              '''USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/151.0.0.0 Safari/537.36"
          )'''
          )

          old_rss = '''    rss_response = fetch(session, RSS)
              (out / "uf_rss.xml").write_bytes(rss_response.content)
              rss_rows, rss_by_url = parse_rss(rss_response.content)
          '''
          new_rss = '''    rss_rows = []
              rss_by_url = {}
              (out / "uf_rss_retrieval_status.json").write_text(
                  json.dumps({"rows": 0, "status": "SKIPPED TO AVOID WAF; LIVE SEARCH IS ENUMERATION AUTHORITY"}, indent=2),
                  encoding="utf-8",
              )
          '''
          if old_rss not in text:
              raise SystemExit('Expected UF RSS block was not found')
          text = text.replace(old_rss, new_rss)

          text = text.replace(
              '''    first_response = fetch(session, SEARCH)
          ''',
              '''    warmup = fetch(session, BASE, attempts=4, timeout=90.0)
              (out / "catalog_homepage.html").write_bytes(warmup.content)
              time.sleep(2.0)
              first_response = fetch(session, SEARCH, attempts=5, timeout=90.0)
          '''
          )

          text = text.replace(
              '''        print(f"search_page={page_index} rows={len(page_rows)} unique={len(listings_by_url)}", flush=True)
          ''',
              '''        print(f"search_page={page_index} rows={len(page_rows)} unique={len(listings_by_url)}", flush=True)
                  time.sleep(0.45)
          '''
          )

          text = text.replace(
              'with ThreadPoolExecutor(max_workers=6) as pool:',
              'with ThreadPoolExecutor(max_workers=2) as pool:'
          )

          text = text.replace(
              '''        local = requests.Session(); local.headers.update(session.headers)
              response = fetch(local, url)
          ''',
              '''        local = requests.Session(); local.headers.update(session.headers)
              local.headers.update({"Referer": SEARCH})
              response = fetch(local, url, attempts=5, timeout=90.0)
          '''
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Harvest UF public licensing catalog
        id: harvest
        shell: bash
        run: |
          set +e
          python scripts/uf_technology_publisher_harvest.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload source-complete evidence
        uses: actions/upload-artifact@v4
        with:
          name: uf-source-complete-harvest-2026-08-05
          path: uf-harvest/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Enforce source-completion gate
        shell: bash
        run: |
          test "${{ steps.harvest.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('uf-harvest/uf_source_manifest.json').read_text())
          assert manifest['source_complete'] is True, manifest
          assert manifest['normalized_listing_records'] == manifest['official_live_search_total'], manifest
          assert manifest['unique_listing_identities'] == manifest['official_live_search_total'], manifest
          assert manifest['unique_official_record_urls'] == manifest['official_live_search_total'], manifest
          assert manifest['search_pages_with_receipts'] == manifest['search_pages_expected'], manifest
          assert manifest['detail_pages_with_receipts'] == manifest['official_live_search_total'], manifest
          assert manifest['required_fields_missing'] == 0, manifest
          assert manifest['errors'] == 0, manifest
          print(json.dumps(manifest, indent=2))
          PY
