name: UF Technology Publisher Source-Complete Harvest

on:
  push:
    branches:
      - harvest/uf-source-complete-2026-08-05
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Harvest UF public licensing catalog
        id: harvest
        shell: bash
        run: |
          set +e
          python scripts/uf_technology_publisher_harvest_v2.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload source-complete evidence
        uses: actions/upload-artifact@v4
        with:
          name: uf-source-complete-harvest-2026-08-05
          path: uf-harvest/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Enforce source-completion gate
        shell: bash
        run: |
          test "${{ steps.harvest.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('uf-harvest/uf_source_manifest.json').read_text())
          assert manifest['source_complete'] is True, manifest
          assert manifest['displayed_search_result_count'] == 770, manifest
          assert manifest['official_live_search_total'] == 768, manifest
          assert manifest['independent_rss_item_count'] == 768, manifest
          assert manifest['normalized_listing_records'] == 768, manifest
          assert manifest['unique_listing_identities'] == 768, manifest
          assert manifest['unique_official_record_urls'] == 768, manifest
          assert manifest['search_pages_with_receipts'] == 77, manifest
          assert manifest['detail_pages_with_receipts'] == 768, manifest
          assert manifest['required_fields_missing'] == 0, manifest
          assert manifest['errors'] == 0, manifest
          print(json.dumps(manifest, indent=2))
          PY
