name: U-M Available Inventions Source-Complete Harvest

on:
  push:
    branches:
      - harvest/umich-source-complete-2026-08-05
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Harvest all public U-M invention listings
        id: harvest
        shell: bash
        run: |
          set +e
          python scripts/umich_source_complete_harvest.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload source-complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umich-source-complete-harvest-2026-08-05
          path: umich-harvest/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Enforce source-completion gate
        run: |
          test "${{ steps.harvest.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('umich-harvest/umich_source_manifest.json').read_text())
          assert manifest['source_complete'] is True, manifest
          assert manifest['official_search_api_total'] == 834, manifest
          assert manifest['autocomplete_records'] == 834, manifest
          assert manifest['normalized_listing_records'] == 834, manifest
          assert manifest['unique_elucid_product_ids'] == 834, manifest
          assert manifest['unique_official_record_urls'] == 834, manifest
          assert manifest['detail_pages_with_receipts'] == 834, manifest
          assert manifest['required_fields_missing'] == 0, manifest
          assert manifest['errors'] == 0, manifest
          print(json.dumps(manifest, indent=2))
          PY
