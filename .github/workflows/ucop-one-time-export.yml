name: UCOP One-Time Technology Export

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ucop-one-time-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Export UCOP catalog
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          BASE = "https://techtransfer.universityofcalifornia.edu"
          INDEX_URL = f"{BASE}/Tech"
          OUT = Path("out")
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "ArnsInnovations-UCOP-Public-Catalog-Indexer/1.0 (+public research data import)",
              "Accept": "text/html,application/xhtml+xml",
          })

          def fetch(url: str) -> str:
              response = session.get(url, timeout=120)
              response.raise_for_status()
              return response.text

          def parse_records(html: str):
              soup = BeautifulSoup(html, "html.parser")
              records = []
              seen = set()
              campus_names = {
                  "Berkeley": "University of California, Berkeley",
                  "Davis": "University of California, Davis",
                  "Irvine": "University of California, Irvine",
                  "Los Angeles": "University of California, Los Angeles",
                  "Merced": "University of California, Merced",
                  "Riverside": "University of California, Riverside",
                  "San Diego": "University of California, San Diego",
                  "San Francisco": "University of California, San Francisco",
                  "Santa Barbara": "University of California, Santa Barbara",
                  "Santa Cruz": "University of California, Santa Cruz",
              }

              for anchor in soup.find_all("a", href=True):
                  match = re.search(r"/NCD/(?:NCDPDF(?:\.aspx)?\?ncdid=)?(\d+)(?:\.html)?", anchor.get("href", ""), re.I)
                  if not match:
                      continue
                  tech_id = match.group(1)
                  title = " ".join(anchor.get_text(" ", strip=True).split())
                  if not title or tech_id in seen or title.lower() in {"download pdf", "permalink", "request information"}:
                      continue
                  seen.add(tech_id)
                  row_text = ""
                  parent = anchor.find_parent("tr") or anchor.parent
                  if parent:
                      row_text = " ".join(parent.get_text(" ", strip=True).split())
                  campus = ""
                  for needle, full in campus_names.items():
                      if needle.lower() in row_text.lower():
                          campus = full
                          break
                  records.append({"tech_id": tech_id, "title": title, "campus": campus})

              if len(records) < 3000:
                  # Fallback for alternate markup: pair Tech ID text with the next NCD-linked title.
                  pattern = re.compile(
                      r"(?:Tech\s*ID[^0-9]{0,100})?(\d{4,6}).{0,1500}?href=[\"'][^\"']*/NCD/\1\.html[^\"']*[\"'][^>]*>(.*?)</a>",
                      re.I | re.S,
                  )
                  for tech_id, raw_title in pattern.findall(html):
                      if tech_id in seen:
                          continue
                      title = BeautifulSoup(raw_title, "html.parser").get_text(" ", strip=True)
                      title = " ".join(title.split())
                      if title:
                          seen.add(tech_id)
                          records.append({"tech_id": tech_id, "title": title, "campus": ""})
              return records

          html = fetch(INDEX_URL)
          (OUT / "ucop_tech_index_raw.html").write_text(html, encoding="utf-8")
          records = parse_records(html)

          # Attempt campus assignment through the catalog's campus-filtered public views.
          campus_codes = {
              "BK": "University of California, Berkeley",
              "DA": "University of California, Davis",
              "IR": "University of California, Irvine",
              "LA": "University of California, Los Angeles",
              "MR": "University of California, Merced",
              "RV": "University of California, Riverside",
              "SD": "University of California, San Diego",
              "SF": "University of California, San Francisco",
              "SB": "University of California, Santa Barbara",
              "SC": "University of California, Santa Cruz",
          }
          by_id = {row["tech_id"]: row for row in records}
          campus_probe = {}
          for code, campus_name in campus_codes.items():
              best_ids = set()
              best_url = ""
              for url in (
                  f"{BASE}/Tech?campus={code}",
                  f"{BASE}/Default?RunSearch=true&campus={code}",
                  f"{BASE}/default.aspx?campus={code}",
              ):
                  try:
                      subset = parse_records(fetch(url))
                  except Exception as exc:
                      campus_probe.setdefault(code, []).append({"url": url, "error": str(exc)})
                      continue
                  ids = {row["tech_id"] for row in subset}
                  campus_probe.setdefault(code, []).append({"url": url, "count": len(ids)})
                  if 0 < len(ids) < len(records) and len(ids) > len(best_ids):
                      best_ids = ids
                      best_url = url
              for tech_id in best_ids:
                  if tech_id in by_id and not by_id[tech_id]["campus"]:
                      by_id[tech_id]["campus"] = campus_name
              if best_ids:
                  campus_probe[code].append({"selected_url": best_url, "assigned": len(best_ids)})

          extracted_at = datetime.now(timezone.utc).isoformat()
          rows = []
          for position, record in enumerate(records, start=1):
              tech_id = record["tech_id"]
              campus = record["campus"]
              rows.append({
                  "source_position": position,
                  "tech_id": tech_id,
                  "title": record["title"],
                  "campus": campus,
                  "campus_assignment_status": "catalog-filter-derived" if campus else "detail-enrichment-required",
                  "source_url": f"{BASE}/NCD/{tech_id}.html",
                  "pdf_url": f"{BASE}/NCD/NCDPDF?ncdid={tech_id}",
                  "catalog_url": INDEX_URL,
                  "extracted_at_utc": extracted_at,
              })

          fields = [
              "source_position", "tech_id", "title", "campus", "campus_assignment_status",
              "source_url", "pdf_url", "catalog_url", "extracted_at_utc"
          ]
          with (OUT / "ucop_technology_catalog.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)

          summary = {
              "index_url": INDEX_URL,
              "html_bytes": len(html.encode("utf-8")),
              "record_count": len(rows),
              "unique_tech_id_count": len({row["tech_id"] for row in rows}),
              "campus_assigned_count": sum(bool(row["campus"]) for row in rows),
              "campus_unassigned_count": sum(not bool(row["campus"]) for row in rows),
              "first_record": rows[0] if rows else None,
              "last_record": rows[-1] if rows else None,
              "campus_probe": campus_probe,
              "extracted_at_utc": extracted_at,
          }
          (OUT / "ucop_export_summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary, indent=2))

          if len(rows) < 3700:
              raise SystemExit(f"Parsed only {len(rows)} UCOP records; refusing incomplete export")
          PY
      - name: Upload UCOP export artifact
        uses: actions/upload-artifact@v4
        with:
          name: ucop-technology-export
          path: out/
          if-no-files-found: error
          retention-days: 1
