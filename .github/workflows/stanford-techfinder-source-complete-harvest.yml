name: Stanford TechFinder Source-Complete Harvest

on:
  push:
    branches:
      - harvest/stanford-techfinder-source-complete-2026-08-04
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Harvest Stanford public catalog
        id: harvest
        shell: bash
        run: |
          set +e
          python scripts/stanford_techfinder_harvest.py \
            --output-dir harvest-output \
            --delay 0.35 \
            --timeout 60 \
            --attempts 4
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete harvest evidence
        uses: actions/upload-artifact@v4
        with:
          name: stanford-techfinder-source-complete-harvest-2026-08-04
          path: harvest-output/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce source-completion gate
        shell: bash
        run: |
          test "${{ steps.harvest.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('harvest-output/stanford_techfinder_source_manifest.json').read_text())
          assert manifest['source_complete'] is True, manifest
          assert manifest['unique_listings'] == manifest['official_live_result_count'], manifest
          assert manifest['pages_with_receipts'] == manifest['expected_pages'], manifest
          assert manifest['page_errors'] == 0, manifest
          assert manifest['duplicate_listing_identities'] == 0, manifest
          assert manifest['required_fields_missing'] == 0, manifest
          print(json.dumps(manifest, indent=2))
          PY
