name: Oxford OUI Source-Complete Harvest

on:
  push:
    branches:
      - harvest/oxford-oui-source-complete-2026-08-05
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Harvest Oxford public licensing catalog
        id: harvest
        shell: bash
        run: |
          set +e
          python scripts/oxford_oui_harvest.py \
            --output-dir oxford-oui-harvest \
            --timeout 60 \
            --attempts 4 \
            --workers 6
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload source-complete evidence
        uses: actions/upload-artifact@v4
        with:
          name: oxford-oui-source-complete-harvest-2026-08-05
          path: oxford-oui-harvest/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce source-completion gate
        shell: bash
        run: |
          test "${{ steps.harvest.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('oxford-oui-harvest/oxford_oui_source_manifest.json').read_text())
          assert manifest['source_complete'] is True, manifest
          assert manifest['official_live_directory_records'] == 207, manifest
          assert manifest['normalized_listing_records'] == 207, manifest
          assert manifest['unique_listing_identities'] == 207, manifest
          assert manifest['unique_official_record_urls'] == 207, manifest
          assert manifest['detail_pages_with_receipts'] == 207, manifest
          assert manifest['required_fields_missing'] == 0, manifest
          assert manifest['errors'] == 0, manifest
          print(json.dumps(manifest, indent=2))
          PY
