name: Oxford OUI Source Discovery

on:
  push:
    branches:
      - harvest/oxford-oui-source-complete-2026-08-05
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Discover Oxford public catalog routes
        run: python scripts/oxford_oui_discovery.py
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: oxford-oui-source-discovery-2026-08-05
          path: oxford-discovery/
          if-no-files-found: error
          retention-days: 14
